<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amount Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>💰 Amount Tracker</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('single')">
            Single Tracker
        </button>

        <button class="tab-btn" onclick="openTab('multiple')">
            Multiple Tracker
        </button>
    </div>

    <!-- SINGLE -->
    <div id="single" class="tab-content active">

        <div class="card">
            <h2>Single Amount Tracker</h2>

            <div id="single-list"></div>

            <button class="primary-btn" onclick="addSingleAmount()">
                + Add Amount
            </button>

            <div class="total-box">
                Total: <span id="single-total">0</span>
            </div>
        </div>

    </div>

    <!-- MULTIPLE -->
    <div id="multiple" class="tab-content">

        <div class="card">
            <h2>Multiple Amount Tracker</h2>

            <div id="trackers"></div>

            <button class="primary-btn" onclick="addTracker()">
                + Add Tracker
            </button>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
